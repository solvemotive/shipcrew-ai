name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: node --check bin/cli.js && node --check bin/lib/autopilot.js
      - name: Unit tests
        run: node --test test/*.test.js
      - name: Agent sync check
        run: |
          diff -rq agents .claude/agents
          test "$(ls agents/*.md | wc -l)" -eq "$(ls .cursor/agents/*.md | wc -l)"
          node --test --test-name-pattern='^all 23 \.cursor/agents/\*\.md files match toCursorAgent\(agents/\*\.md\)$' test/cli.test.js
      - name: Pack dry-run
        run: npm pack --dry-run
