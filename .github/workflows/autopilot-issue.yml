name: Autopilot issue → voyage

# Label an issue `ship` or `autopilot` to open a voyage PR + comment the run prompt.
on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  open-voyage:
    if: github.event.label.name == 'ship' || github.event.label.name == 'autopilot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create voyage branch and files
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          BRANCH="autopilot/issue-${ISSUE_NUMBER}"
          git config user.name "shipcrew-ai bot"
          git config user.email "bot@users.noreply.github.com"
          git checkout -B "$BRANCH"

          mkdir -p .shipcrew

          # Prefer policy/DoD already installed by `shipcrew-ai init` (.shipcrew/*).
          # Only seed from package templates when those files are missing (shipcrew-ai source repo).
          # If still missing (typical app repo without templates/), write a minimal stub so gates exist.
          seed_shipcrew_file() {
            local name="$1"
            local dest=".shipcrew/${name}"
            local tmpl="templates/shipcrew/${name}"
            if [ -f "$dest" ]; then
              echo "Keeping existing ${dest}"
              return 0
            fi
            if [ -f "$tmpl" ]; then
              cp "$tmpl" "$dest"
              echo "Seeded ${dest} from ${tmpl}"
              return 0
            fi
            return 1
          }

          if ! seed_shipcrew_file policy.md; then
            cat > .shipcrew/policy.md <<'POLICY'
          # shipcrew-ai policy (autopilot)

          Seeded by the GitHub autopilot workflow because `.shipcrew/policy.md` was missing.
          Prefer running `npx @solvemotive/shipcrew-ai init` so the full policy template is installed.

          ## Mandatory gates

          | Condition | Required agents |
          |-----------|-----------------|
          | Auth, sessions, API keys, multi-tenant, payments | @gunner, @lookout |
          | Public APIs | @rigger then @gunner |
          | CI / deploy | @quartermaster |

          ## Rules

          - @captain orchestrates only; no app code from Captain
          - Do not mark voyage `shipped` until `.shipcrew/dod.md` is satisfied
          POLICY
            node -e 'const fs=require("fs");let s=fs.readFileSync(".shipcrew/policy.md","utf8");s=s.split("\n").map(l=>l.replace(/^          /,"")).join("\n");fs.writeFileSync(".shipcrew/policy.md",s);'
            echo "Wrote minimal .shipcrew/policy.md stub"
          fi

          if ! seed_shipcrew_file dod.md; then
            cat > .shipcrew/dod.md <<'DOD'
          # Definition of Done (autopilot)

          Seeded by the GitHub autopilot workflow because `.shipcrew/dod.md` was missing.
          Prefer `npx @solvemotive/shipcrew-ai init` for the full checklist.

          - [ ] Acceptance criteria met
          - [ ] Happy path works
          - [ ] @gunner / @lookout done when policy requires (or N/A documented)
          - [ ] No secrets committed
          DOD
            node -e 'const fs=require("fs");let s=fs.readFileSync(".shipcrew/dod.md","utf8");s=s.split("\n").map(l=>l.replace(/^          /,"")).join("\n");fs.writeFileSync(".shipcrew/dod.md",s);'
            echo "Wrote minimal .shipcrew/dod.md stub"
          fi

          CREW="ship-crew"
          if [ -f .shipcrew/crew.json ]; then
            CREW="$(node -e 'try{const c=JSON.parse(require("fs").readFileSync(".shipcrew/crew.json","utf8")).crew;process.stdout.write((typeof c==="string"&&c.trim())||"ship-crew")}catch{process.stdout.write("ship-crew")}')"
          fi

          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > .shipcrew/voyage.yml <<EOF
          # Autopilot voyage from GitHub issue #${ISSUE_NUMBER}
          id: "issue-${ISSUE_NUMBER}"
          goal: $(node -p 'JSON.stringify(process.env.ISSUE_TITLE || "")')
          status: in_progress
          crew: ${CREW}
          created_at: "${NOW}"
          updated_at: "${NOW}"
          source: "github-issue"

          policy: .shipcrew/policy.md
          dod: .shipcrew/dod.md

          acceptance_criteria: []
          tasks: []
          gates:
            gunner: pending
            lookout: pending
            cartographer: n/a
            quartermaster: n/a
          blockers: []
          summary: ""
          EOF

          # Fix YAML indentation (heredoc above may be indented)
          node -e '
            const fs=require("fs");
            let s=fs.readFileSync(".shipcrew/voyage.yml","utf8");
            s=s.split("\n").map(l=>l.replace(/^          /,"")).join("\n");
            fs.writeFileSync(".shipcrew/voyage.yml", s);
          '

          printf '%s\n' "# Autopilot mission (issue #${ISSUE_NUMBER})" "" "$ISSUE_BODY" > .shipcrew/ISSUE.md

          git add .shipcrew
          git commit -m "chore: open autopilot voyage for #${ISSUE_NUMBER}" || echo "No changes"
          git push -u origin "$BRANCH" --force

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          BRANCH="autopilot/issue-${ISSUE_NUMBER}"
          if gh pr list --head "$BRANCH" --json number --jq 'length' | grep -q '^0$'; then
            gh pr create --base main --head "$BRANCH" \
              --title "Autopilot: ${ISSUE_TITLE}" \
              --body "$(cat <<EOF
          ## Autopilot voyage

          Opened from issue #${ISSUE_NUMBER}.

          ### Run locally or in Cursor/Claude

          \`\`\`bash
          npx --yes github:solvemotive/shipcrew-ai init ship-crew
          npx --yes github:solvemotive/shipcrew-ai resume
          \`\`\`

          Or:

          \`\`\`
          /autopilot ${ISSUE_TITLE}
          \`\`\`

          Obey \`.shipcrew/policy.md\` and \`.shipcrew/dod.md\`. Mark voyage shipped only when DoD is complete.
          EOF
          )"
          else
            echo "PR already exists"
          fi

      - name: Comment on issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.issue.title;
            const n = context.payload.issue.number;
            const body = `⚓ **shipcrew-ai autopilot** armed for this issue.

            1. Checkout the \`autopilot/issue-${n}\` PR branch (or pull latest).
            2. Run:
            \`\`\`bash
            npx --yes github:solvemotive/shipcrew-ai init ship-crew
            \`\`\`
            3. In Claude Code / Cursor:
            \`\`\`
            /autopilot ${title}
            \`\`\`
            or \`shipcrew-ai resume\` after pulling \`.shipcrew/voyage.yml\`.

            Policy + DoD gates are mandatory before marking shipped.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: n,
              body
            });
